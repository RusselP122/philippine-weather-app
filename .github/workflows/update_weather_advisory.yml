name: Update Weather Advisory Data
on:
  schedule:
    - cron: '45 2,8,14,20 * * *' # Run 4 times a day, 15 minutes after TC track updates
  workflow_dispatch:

jobs:
  update-advisory:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install system dependencies (eccodes, geos)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libgeos-dev
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy shapely requests xarray zarr gcsfs ecmwf-opendata eccodes
          
      - name: Authenticate to Google Cloud (if secret available)
        env:
          GCP_KEY_JSON: ${{ secrets.GCP_SA_KEY }}
        if: "${{ env.GCP_KEY_JSON != '' }}"
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Fetch and Generate AI Multi-Model Advisory Data
        run: |
          python generate_advisory_data.py
          
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/advisory_data.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update AI Multi-Model Weather Advisory Data [skip ci]"
            git pull --rebase origin main
            git push
          fi
