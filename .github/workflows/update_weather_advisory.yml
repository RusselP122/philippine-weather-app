name: Update Weather Advisory Data
on:
  schedule:
    - cron: '45 2,8,14,20 * * *' # Run 4 times a day, 15 minutes after TC track updates
  workflow_dispatch:

concurrency:
  group: weather-data-sync
  cancel-in-progress: false

jobs:
  update-advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install system dependencies (eccodes, geos)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libgeos-dev
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy shapely requests xarray zarr gcsfs ecmwf-opendata eccodes google-cloud-storage google-auth numcodecs matplotlib

      - name: Authenticate to Google Cloud
        env:
          GCP_KEY_JSON: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_KEY_JSON" ]; then
            echo "ERROR: GCP_SA_KEY secret is not configured or empty!"
            exit 1
          fi
          KEY_PATH="$GITHUB_WORKSPACE/gcp-key.json"
          echo "$GCP_KEY_JSON" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_PATH" >> $GITHUB_ENV

      - name: Fetch and Generate AI Multi-Model Advisory Data
        run: |
          python generate_advisory_data.py

      - name: Clean up GCP key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/gcp-key.json"
          
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/advisory_data.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update AI Multi-Model Weather Advisory Data [skip ci]"
            for i in 1 2 3 4 5; do
              echo "Push attempt $i..."
              git pull --rebase origin main
              git push && echo "Push successful!" && break
              echo "Push failed. Retrying..."
              sleep $((15 * i))
            done
          fi
