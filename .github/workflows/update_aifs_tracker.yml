name: Update ECMWF AIFS Tracker

on:
  schedule:
    # Runs at 02:00, 08:00, 14:00, 20:00 UTC (to give AIFS data time to publish after initialization)
    - cron: '0 2,8,14,20 * * *'
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  update-aifs-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies for cartopy and cfgrib
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin libeccodes-dev

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas xarray cfgrib eccodes ecmwf-opendata matplotlib cartopy

      - name: Run AIFS Tracker
        run: |
          python aifs_tracker.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add the newly generated AIFS mock/forecast track images
          git add public/assets/aifs_tropical_cyclone_*_forecast_*.png
          
          # Commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update ECMWF AIFS Tracker images [skip ci]"
            git push
          fi
