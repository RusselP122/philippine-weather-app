name: Update NOAA AIGFS Maps

on:
  schedule:
    # Runs at 03:30, 09:30, 15:30, 21:30 UTC
    # AIGFS 00z ready ~3.5h after init
    - cron: '30 3,9,15,21 * * *'
  workflow_dispatch:

jobs:
  update-aigfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin libeccodes-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            matplotlib \
            cartopy \
            numpy \
            scipy \
            requests \
            eccodes

      - name: Run AIGFS Wind + MSLP generator
        run: python wind_aigfs.py
        
      - name: Run AIGFS 24h Rainfall generator
        run: python rainfall_aigfs.py
        
      - name: Run AIGFS 6h Precip + MSLP generator
        run: python precip_mslp_aigfs.py

      - name: Commit and push changes
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stage output images and metadata
          git add -f public/images/wind_aigfs/*.png || true
          git add -f public/data/wind_aigfs_meta.json || true
          
          git add -f public/images/rainfall_aigfs/*.png || true
          git add -f public/data/rainfall_aigfs_meta.json || true
          
          git add -f public/images/precip_mslp_aigfs/*.png || true
          git add -f public/data/precip_mslp_aigfs_meta.json || true

          # Commit only if something changed
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update NOAA AIGFS maps (Wind, Rain, Precip) [skip ci]"

            # Retry push up to 5 times to handle transient GitHub errors
            for i in 1 2 3 4 5; do
              echo "Push attempt $i..."
              git pull --rebase origin main
              git push && echo "Push successful!" && break
              echo "Push failed (attempt $i). Retrying..."
              sleep $((15 * i))
            done
          fi
