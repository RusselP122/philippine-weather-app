name: Update ECMWF IFS TC Tracks
on:
  schedule:
    - cron: '30 2,8,14,20 * * *' # Run 4 times a day, giving time for the data to be ready
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install system dependencies (eccodes)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas ecmwf-opendata eccodes numpy
          
      - name: Download and Process IFS Tracks
        run: |
          python tc_ifs_tracks.py
          
      - name: Generate static map images
        run: |
          python plot_ifs_tracks.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ifs_tc_latest.csv
          git add public/assets/ifs_tropical_cyclone_*
          # Only commit if there are changes
          git diff --staged --quiet || (git commit -m "Auto-update ECMWF IFS TC Tracks and Images" && git push)
