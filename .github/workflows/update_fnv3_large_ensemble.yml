name: Update FNV3 Large Ensemble Forecast Images

on:
  schedule:
    # Runs at 00:00, 06:00, 12:00, and 18:00 UTC every day
    - cron: '0 0,6,12,18 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  update-fnv3-large-ensemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install matplotlib cartopy pandas numpy requests scikit-learn scipy
          if [ -f requirements_dev.txt ]; then pip install -r requirements_dev.txt; fi

      - name: Run FNV3 Large Ensemble forecast logic
        run: |
          # Running FNV3 Large Ensemble forecast scripts
          python Forcast3.py
          python forcast4.py

      - name: Download FNV3 Large Ensemble paired/mean track CSV
        run: |
          BASE_URL="https://deepmind.google.com/science/weatherlab/download/cyclones/FNV3_LARGE_ENSEMBLE/ensemble_mean/paired/csv"
          OUTPUT="public/data/fnv3_large_paired_latest.csv"
          FOUND=false

          # Probe the last 3 days × 4 cycles to find the latest available run
          for DAYS_AGO in 0 1 2 3; do
            DATE=$(date -u -d "-${DAYS_AGO} days" +%Y_%m_%d)
            for HOUR in 18 12 06 00; do
              URL="${BASE_URL}/FNV3_LARGE_ENSEMBLE_${DATE}T${HOUR}_00_paired.csv"
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "$URL")
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✓ Found large ensemble paired run: ${DATE}T${HOUR}:00"
                curl -sL -o "$OUTPUT" "$URL"
                echo "  Downloaded → $OUTPUT ($(wc -c < "$OUTPUT") bytes)"
                FOUND=true
                break 2
              fi
            done
          done

          if [ "$FOUND" = "false" ]; then
            echo "⚠ No large ensemble paired CSV found in last 3 days — skipping (will use computed median)"
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          python scripts/obfuscate_csvs.py
          
          # Add forecast PNGs and the proxied CSVs for browser use
          git add public/assets/fnv3_*.png
          git add -f public/data/fnv3_large_latest.dat || true
          git add -f public/data/fnv3_large_paired_latest.dat || true
          
          # Commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update FNV3 Large Ensemble forecast images [skip ci]"
            git pull --rebase origin main
            git push
          fi
