name: Auto Post Weather Alerts to Facebook

on:
  schedule:
    # Run every hour at the top of the hour (e.g. 1:00, 2:00, etc.)
    - cron: '0 * * * *'
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # cache pip dependencies
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests geopandas matplotlib
        
    - name: Generate Weather Alert Maps and Captions
      run: |
        python scripts/generate_fb_alert_map.py
        
    - name: Post to Facebook Page
      env:
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      run: |
        python scripts/post_to_facebook.py
