name: Update NOAA AI-GEFS TC Tracks
on:
  schedule:
    - cron: '15 4,10,16,22 * * *' # Run 4 times a day (after NCEP runs 00, 06, 12, 18Z)
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install system dependencies (proj for cartopy)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib cartopy
          
      - name: Download and Process AI-GEFS Tracks
        run: |
          python tc_aigefs_tracks.py
          
      - name: Generate static map images
        run: |
          python plot_aigefs_tracks.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage files first so they are not untracked
          git add -f public/data/aigefs_tc_latest.dat || true
          git add public/assets/aigefs_tropical_cyclone_* || true
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update NOAA AI-GEFS TC Tracks and Images [skip ci]"
            # Pull rebase with 'theirs' strategy to favor our local commit in case of conflict
            git pull --rebase -X theirs origin main
            git push
          fi
