name: Update Rainfall Forecast
on:
  schedule:
    - cron: '0 */3 * * *' # Run every 3 hours to cover GFS 6h cycles
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-maps:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Cartopy & Eccodes)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin libgdal-dev libeccodes0 libaec-dev

    - name: Install Python Dependencies
      run: |
        pip install requests numpy matplotlib cartopy pydap netCDF4 scipy Jinja2 ecmwf-opendata cfgrib ecmwflibs xarray imageio

    - name: Ensure Output Directories Exist
      run: |
        mkdir -p public/images/rainfall
        mkdir -p public/images/wind
        mkdir -p public/images/precip_mslp
        mkdir -p public/images/precip_mslp_aifs
        mkdir -p public/data

    - name: Run Rain Generation Script
      run: python rain.py

    - name: Run Wind Generation Script (ECMWF AIFS)
      run: python wind_aifs.py

    - name: Run Precip + MSLP + Thickness Script (GFS)
      run: python precip_mslp_thickness.py

    - name: Run Precip + MSLP + Thickness Script (AIFS)
      run: python precip_mslp_aifs.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        git add -f \
          'public/images/rainfall/*.png' \
          'public/images/wind/*.png' \
          'public/images/precip_mslp/*.png' \
          'public/images/precip_mslp_aifs/*.png' \
          'public/images/rainfall/*.gif' \
          'public/images/wind/*.gif' \
          'public/data/*.json' 2>/dev/null || true

        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update Weather Forecast Maps (Rainfall, Wind, Precip+MSLP) [Automated]"

          # Retry push up to 5 times to handle concurrent workflow conflicts
          for i in 1 2 3 4 5; do
            echo "Push attempt $i..."
            git pull --rebase origin main && git push && echo "Push successful!" && break
            echo "Push failed (attempt $i). Waiting before retry..."
            sleep $((15 * i))
          done
        fi
